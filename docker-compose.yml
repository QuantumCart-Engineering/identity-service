services:
  identity-mysql:
    image: mysql:8.4
    container_name: quantumcart-identity-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: quantumcart
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - identity_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -uquantumcart -p$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - quantumcart-network

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: quantumcart-identity-service

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 8001

      DB_HOST: identity-mysql
      DB_PORT: 3306
      DB_USER: quantumcart
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT}

    ports:
      - "8001:8001"

    depends_on:
      identity-mysql:
        condition: service_healthy

    networks:
      - quantumcart-network

volumes:
  identity_mysql_data:

networks:
  quantumcart-network:
    external: true
