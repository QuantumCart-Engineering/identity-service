name: Identity Service CI

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - dev
      - uat
      - master

jobs:
  test:
    name: Test Identity Service

    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: identity_test_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: identity_test_db
          DB_CONNECTION_LIMIT: 10
        run: npm run test:db

      - name: Run database migrations
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: identity_test_db
          DB_CONNECTION_LIMIT: 10
        run: npm run test:migrate

      - name: Validate branch promotion
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.base_ref }}" = "uat" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ Only dev can create PRs to uat."
            echo "Source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            exit 1
          fi

          if [ "${{ github.base_ref }}" = "master" ] && [ "${{ github.head_ref }}" != "uat" ]; then
            echo "❌ Only uat can create PRs to master."
            echo "Source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            exit 1
          fi

          echo "✅ Branch promotion is valid."

      - name: Run tests with coverage
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: identity_test_db
          DB_CONNECTION_LIMIT: 10
          JWT_SECRET: test-only-jwt-secret-for-ci
        run: npm run test:coverage